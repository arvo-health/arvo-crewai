[project]
name = "arvo_auth"
version = "0.1.0"
description = "arvo-auth crewai multi-team automation"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools,anthropic]==1.14.4"
]

[project.scripts]
arvo_auth = "arvo_auth.main:run"
run_crew = "arvo_auth.main:run"
train = "arvo_auth.main:train"
replay = "arvo_auth.main:replay"
test = "arvo_auth.main:test"
run_with_trigger = "arvo_auth.main:run_with_trigger"
run_srs = "arvo_auth.main:run_srs"
run_srs_replay = "arvo_auth.main:run_srs_replay"
run_notion_publish = "arvo_auth.main:run_notion_publish"
run_notion_gap_comments = "arvo_auth.main:run_notion_gap_comments"
run_srs_meeting_update = "arvo_auth.main:run_srs_meeting_update"
run_srs_meeting_update_apply = "arvo_auth.main:run_srs_meeting_update_apply"
run_srs_notion_diff_apply = "arvo_auth.main:run_srs_notion_diff_apply"
run_frontend_branch_mapping = "arvo_auth.main:run_frontend_branch_mapping"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Chroma / embedding stack may pull onnxruntime without a macOS wheel for very new
# platform tags; pin until upstream publishes darwin wheels.
[tool.uv]
override-dependencies = ["onnxruntime==1.20.1"]

[tool.crewai]
type = "crew"
