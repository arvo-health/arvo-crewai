archaeology_task:
  description: >
    Project: {project_name}. Repository (logical name): {repo_name}.
    Service path: {service_path}. Status hint: {status_hint}. Year: {current_year}.

    Step 1 — Produce state.md by reading the service and its surroundings.

    Suggested order of reads (use list_repo_directory first to discover the
    structure, then read_repo_file for specific files, and read_git_log for
    activity signals):

      1) `list_repo_directory(repo="{repo_name}", relative_path="{service_path}",
         max_depth=3)` — get the service layout.
      2) `list_repo_directory(repo="{repo_name}", relative_path="memory-bank",
         max_depth=2)` — check for repo-level memory-bank. If it exists, read
         every file in it (projectbrief.md is highest priority).
      3) `read_repo_file(repo="{repo_name}", relative_path="{service_path}/README.md")`
         and the equivalents for CLAUDE.md / AGENTS.md / DEPLOYMENT.md if present.
      4) `read_repo_file` on the service entry point (main.py, app/main.py, etc.).
      5) `read_git_log(repo="{repo_name}")` — overall activity, last 20 commits.
      6) `read_git_log(repo="{repo_name}", relative_path="{service_path}")` —
         service-scoped activity, last 20 commits.
      7) Read further only files when their relevance is clear from steps 1–6.

    Additional human briefing (optional):
    ---
    {briefing_markdown}
    ---

    External backlog / plan snapshot (optional — may describe pending next
    steps that never happened, decisions, or roadmap items). Treat this as a
    PRIMARY source for "what was planned but not built" — quote items verbatim
    when you reference them and preserve their Estado/status column:
    ---
    {backlog_content}
    ---

    Your output MUST contain the sections enumerated in
    knowledge/handover_archaeologist_identity.md (Service Identity, Lifecycle
    Signals, File Structure, Memory-bank Synthesis if present, Code Surface,
    Abandoned / WIP Signals & Pending Plan Items, Source References).

    For the "Abandoned / WIP Signals & Pending Plan Items" section: if a
    backlog was provided above, enumerate every row whose `Estado` is
    `Pending`, `Pronto para começar`, or `Testes e correções` AND that is
    plausibly relevant to this service. Quote the row verbatim (Estado, Tipo,
    Inteligência/Descrição, ANS codes). For unclear relevance, include with a
    note "may or may not apply to this service".

    Cite every claim with `(per <repo>/<path>)`. Do not speculate.

  expected_output: >
    Dense markdown for state.md following the section structure in the
    archaeologist identity file. Every claim source-cited. Status verdict at
    the top of "Lifecycle Signals" is justified by the signals listed.
  agent: service_archaeologist

operations_task:
  description: >
    Step 2 — Produce operations.md building on state.md (which is already in
    your context from step 1; do not repeat its content).

    Suggested reads (when state.md indicates these files exist):
      - `{service_path}/Dockerfile`
      - `{service_path}/.env.example`
      - `{service_path}/DEPLOYMENT.md`
      - Any `*.yaml` Cloud Run service descriptor under the service path
      - `{service_path}/scripts/*.sh` if any
      - `{service_path}/Makefile` if any
      - `{service_path}/pyproject.toml` (for dependencies and entrypoint)

    To map downstream consumers (Section 7 of the final handover), inspect
    other configured repos via `list_repo_directory` + `read_repo_file`. State
    explicitly which repos you searched and what you searched for.

    Your output MUST contain the sections enumerated in
    knowledge/handover_chronicler_identity.md (Deployment Topology,
    Configuration, Runtime Contracts, Observability, Downstream Consumers,
    Local Development, Source References).

    Preserve verbatim every Cloud Run service name, BigQuery FQN
    (project.dataset.table), Pub/Sub topic name, env var, and secret name.

  expected_output: >
    Dense markdown for operations.md following the section structure in the
    chronicler identity file. Every operational claim source-cited. Downstream
    consumer search method made explicit (which repos, which keywords).
  agent: operational_chronicler

handover_authoring_task:
  description: >
    Step 3 — Author the final handover document for service {service_path} of
    project {project_name}.

    state.md and operations.md from the previous steps are already in your
    context. Synthesise them — do not introduce new facts.

    The mandatory section structure (12 sections, in this exact order) is
    enforced by the rules block below. Read them in full before writing:

    ---
    {handover_authoring_rules}
    ---

    Output a single handover document following those rules verbatim. Preserve
    every business number, status string, date, and identifier from the prior
    artefacts. If a section cannot be filled from the prior artefacts, write
    `_Not captured in source artefacts — see Open Questions._` and add an
    entry to Section 11.

    The Open Questions section MUST exist and SHOULD have at least 3 honest
    unknowns. If you have fewer than 3, re-read the prior artefacts to find
    gaps before finalising.

  expected_output: >
    A complete handover document following the 12 mandatory sections from
    handover_authoring_rules.md. Status verdict in Section 1 explicit. Survival
    Guide in Section 10 with all three subsections actionable. Open Questions
    (Section 11) populated with at least 3 specific unknowns and who would
    resolve each. References (Section 12) covers every file read across the
    three steps.
  agent: handover_author
