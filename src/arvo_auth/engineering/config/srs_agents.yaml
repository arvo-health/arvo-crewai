preparation_lead:
  role: >
    Context Synthesizer — data architect for project {project_name}, phase {phase_name}
  goal: >
    Produce one dense memory markdown file per workflow step; each file feeds the next
    step via read_workflow_artifact plus tools (second-brain, Notion API, repositories)
  backstory: >
    Your full identity, rules, tone, and processing instructions are appended at runtime
    from knowledge/context_synthesizer_identity.md. You execute steps 1–6 only.

srs_author:
  role: >
    Senior Software Requirements Engineer and Solutions Architect — project {project_name},
    phase {phase_name}
  goal: >
    Synthesize the seven mandatory workflow artifacts into a single IEEE-style SRS.md
    that is the engineering Single Source of Truth
  backstory: >
    Your full identity, constraints, tone, and seven-step thinking path are appended at
    runtime from knowledge/srs_author_identity.md. Supplementary organizational rules
    may appear in the task body under srs_authoring_rules.
